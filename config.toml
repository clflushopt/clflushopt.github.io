# The URL the site will be built for
base_url = "https://deferworks.org"
title = "Opinions on Software."
description = "Ramblings on databases, compilers and software matters."

# Configure the local theme.

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Whether to generate an RSS feed at /rss.xml, covering all posts
generate_feeds = true
feed_filenames = ["rss.xml"]

[markdown]
bottom_footnotes = true
smart_punctuation = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "ayu-dark"

[extra]
# Put all your custom variables here
author = "@clflushopt"
auto_date = true
