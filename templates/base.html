<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="darkreader-lock">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ get_url(path='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ get_url(path='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ get_url(path='favicon-16x16.png') }}">
    <link rel="shortcut icon" href="{{ get_url(path='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Mono:wght@400&display=swap">
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
    <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ config.base_url ~ "rss.xml" }}">
</head>
<body>
    <header class="masthead">
        <div class="masthead__inner">
            <h1><a href="{{ config.base_url }}">{{ config.title }}</a></h1>
            <nav>
                <ul>
                    <li><a href="{{ config.base_url }}">home</a></li>
                    <li><a href="{{ get_url(path='@/archives.md') }}">archives</a></li>
                    <li><a href="{{ get_url(path='@/works.md') }}">works</a></li>
                    <li><a href="{{ get_url(path='@/links.md') }}">links</a></li>
                    <li>
                        <button class="theme-toggle" type="button" aria-label="Toggle color scheme">
                            <span class="theme-toggle__label theme-toggle__label--moon" aria-hidden="true">dark</span>
                            <span class="theme-toggle__label theme-toggle__label--sun" aria-hidden="true">light</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p>Built with <a href="https://getzola.org">Zola</a> &copy; {{ now() | date(format="%Y") }} &middot; <a href="{{ config.base_url ~ "rss.xml" }}">rss</a></p>
    </footer>
    <script>
      (function () {
        var btn = document.querySelector('.theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          if (!current) {
            current = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
        });
      })();
    </script>
</body>
</html>
